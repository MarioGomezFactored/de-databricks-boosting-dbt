version: 2

models:
  - name: revenue_by_date
    description: "Daily revenue trends with cumulative totals by currency, excluding cancelled orders."
    columns:
      - name: order_date_key
        description: "Date key in YYYYMMDD format."
        tests:
          - not_null
      - name: currency_code
        description: "ISO currency code."
        tests:
          - not_null
      - name: total_revenue
        tests:
          - not_null
      - name: order_count
        tests:
          - not_null
      - name: cumulative_revenue
        tests:
          - not_null

  - name: top_sellers_ranked
    description: "Sellers ranked by total revenue across all currencies, with market share."
    columns:
      - name: seller_key
        tests:
          - not_null
          - unique
      - name: revenue_rank
        tests:
          - not_null
      - name: revenue_share_pct
        tests:
          - not_null
      - name: margin_pct
        tests:
          - not_null

  - name: category_performance
    description: "Category-level revenue, margin, and discount aggregations with revenue share."
    columns:
      - name: category_key
        tests:
          - not_null
          - unique
      - name: revenue_rank
        tests:
          - not_null
      - name: revenue_share_pct
        tests:
          - not_null
      - name: gross_margin_pct
        tests:
          - not_null

  - name: executive_kpis
    description: "Single-row executive summary joining all three gold tables."
    columns:
      - name: total_orders
        tests:
          - not_null
      - name: total_revenue
        tests:
          - not_null
      - name: active_sellers
        tests:
          - not_null
      - name: active_categories
        tests:
          - not_null
      - name: overall_margin_pct
        tests:
          - not_null
